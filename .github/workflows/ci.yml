name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aivideo
          POSTGRES_PASSWORD: aivideo
          POSTGRES_DB: aivideo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aivideo"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-key-not-used-in-any-deployment
      DATABASE_URL: postgres://aivideo:aivideo@localhost:5432/aivideo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The render tests run the real encoder, so the runner needs it.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings check
        working-directory: backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ${{ env.DJANGO_SECRET_KEY }}-padded-to-a-realistic-length-value
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - run: npm test

      - run: npm run build
