[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "**/migrations", "node_modules", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "S", "RUF"]
ignore = [
  "S101",    # asserts are the point in tests
  "RUF012",  # Django class attributes are conventionally mutable
  "B008",    # DRF/Django idiom: callables in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S105", "S106", "S311", "S603"]
"**/conftest.py" = ["S105", "S106", "S603"]
"backend/config/settings.py" = ["E402"]
