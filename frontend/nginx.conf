server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point, or a deploy ships stale asset references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The SPA owns its routes; hand every unknown path to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
