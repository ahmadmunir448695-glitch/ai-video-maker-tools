# Local development infrastructure.
#
#   docker compose up -d
#
# brings up Postgres, Redis and MinIO (an S3-compatible bucket). The Django app
# and the Celery worker are expected to run on your machine against these, which
# keeps the edit-reload loop fast. To run the app in Docker too, add the
# `app` profile:  docker compose --profile app up -d
#
# Nothing here is production configuration. The passwords are deliberately
# obvious local defaults; a real deployment uses managed services and secrets.

name: ai-video-maker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: aivideo
      POSTGRES_DB: aivideo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo -d aivideo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage, so the storage code path you run locally is
  # the same one that runs in production.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is up, then exits.
  minio-setup:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/aivideo &&
      echo 'bucket ready'
      "

  # ---- Optional: run the app itself in Docker (profile: app) ----

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment: &app-env
      DJANGO_DEBUG: "false"
      # Empty here is intentional: the app refuses to boot without a real key,
      # and a hard Compose requirement would break `docker compose up` for
      # the infrastructure-only services below.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgres://aivideo:aivideo@postgres:5432/aivideo
      REDIS_URL: redis://redis:6379/0
      AWS_STORAGE_BUCKET_NAME: aivideo
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ADDRESSING_STYLE: path
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Concurrency is deliberately low: each render is CPU-bound, and
    # oversubscribing the CPU makes every job slower rather than more of them.
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Periodic tasks: currently just the reaper that fails jobs abandoned by a
    # killed worker, so they become retryable instead of stuck.
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
